name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # mcp-gateway, which the agents' tools, policy and approvals come from:
  # its packages for the VM test and its policy for the policy tests.
  GATEWAY_REPO: sdrahn/mcp-gateway
  GATEWAY_REF: main
  # mcp-docs, which serves custos-docs's guide to agents.
  MCP_DOCS_MODULE: github.com/sdrahn/mcp-docs/cmd/mcp-docs@main

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal test)" || { gofmt -l cmd internal test; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: Units
        # A schedule's timer as agent-admin makes it: the template and its
        # OnCalendar= drop-in (the template alone has none, on purpose).
        run: |
          d=$(mktemp -d)
          cp systemd/* "$d/"
          { cat systemd/agent-schedule@.timer; printf '[Timer]\nOnCalendar=\nOnCalendar=*-*-* 03:00\n'; } >"$d/agent-schedule@t1_check.timer"
          rm "$d/agent-schedule@.timer"
          systemd-analyze verify "$d"/*.service "$d"/*.socket "$d"/*.timer 2>&1 | grep -v 'is not executable' | (! grep .)

  # The Cockpit page (cockpit/custos) in a headless browser, against a
  # stub of cockpit.js with fixtures.
  cockpit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright-core@1
      - run: make cockpit-test
        env:
          CHROME: /usr/bin/google-chrome

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GATEWAY_REPO }}
          ref: ${{ env.GATEWAY_REF }}
          path: mcp-gateway
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: The autonomy modes, with mcp-gateway's policy
        run: make policy-test GATEWAY_POLICY=mcp-gateway/policy

  # The packages, built as OBS builds them, in openSUSE Leap 16: first
  # mcp-gateway's (custos-selinux builds on mcp_gateway.if), then
  # ours. Installing them loads the SELinux modules.
  opensuse:
    runs-on: ubuntu-24.04
    container: registry.opensuse.org/opensuse/leap:16.0
    steps:
      - name: Install tools and rpm macro packages
        run: >
          zypper -n --gpg-auto-import-keys in --no-recommends
          git tar gzip rpm-build rpmlint
          sysuser-tools systemd-rpm-macros selinux-policy-devel policycoreutils
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GATEWAY_REPO }}
          ref: ${{ env.GATEWAY_REF }}
          path: mcp-gateway
      - name: Go for the builds
        # ADK Go needs Go 1.25: from devel:languages:go when Leap's is older.
        run: |
          if ! zypper -n in --no-recommends 'golang(API) >= 1.25' >/dev/null 2>&1; then
            zypper -n ar -f https://download.opensuse.org/repositories/devel:/languages:/go/16.0/ go
            zypper -n --gpg-auto-import-keys ref
            zypper -n in --no-recommends 'golang(API) >= 1.25'
          fi
          go version
      - name: Build mcp-gateway's packages
        working-directory: mcp-gateway
        run: |
          git config --global --add safe.directory '*'
          rpmspec -q --buildrequires packaging/suse/mcp-gateway.spec | grep -v '^golang(API)' >/tmp/br-gw || true
          xargs -r -d '\n' zypper -n --gpg-auto-import-keys in --no-recommends </tmp/br-gw
          version=$(rpmspec -q --srpm --qf '%{version}' packaging/suse/mcp-gateway.spec)
          mkdir -p ~/rpmbuild/SOURCES
          git archive --prefix="mcp-gateway-$version/" -o ~/rpmbuild/SOURCES/mcp-gateway-$version.tar.gz HEAD
          go mod vendor && tar czf ~/rpmbuild/SOURCES/vendor.tar.gz vendor && rm -rf vendor
          cp packaging/suse/mcp-gateway-rpmlintrc ~/rpmbuild/SOURCES/
          # Its tests run in its own CI.
          rpmbuild -bb --nocheck --define "_topdir $HOME/rpmbuild" packaging/suse/mcp-gateway.spec
          zypper -n --gpg-auto-import-keys in --allow-unsigned-rpm ~/rpmbuild/RPMS/noarch/mcp-gateway-selinux-*.rpm
          semodule -l | grep -x mcp_gateway
          mkdir -p "$GITHUB_WORKSPACE/rpms"
          cp ~/rpmbuild/RPMS/*/mcp-gateway-[0-9]*.rpm ~/rpmbuild/RPMS/*/mcp-gateway-selinux-*.rpm "$GITHUB_WORKSPACE/rpms/"
          rm -rf ~/rpmbuild/SOURCES/vendor.tar.gz
      - name: Install build dependencies (from the spec, as OBS does)
        run: |
          rpmspec -q --buildrequires packaging/suse/custos.spec | grep -v '^golang(API)' >/tmp/br
          xargs -r -d '\n' zypper -n --gpg-auto-import-keys in --no-recommends </tmp/br
      - name: Prepare sources (tarball and vendor.tar.gz, as the OBS services do)
        run: |
          version=$(rpmspec -q --srpm --qf '%{version}' packaging/suse/custos.spec)
          git archive --prefix="custos-$version/" -o ~/rpmbuild/SOURCES/custos-$version.tar.gz HEAD
          go mod vendor && tar czf ~/rpmbuild/SOURCES/vendor.tar.gz vendor && rm -rf vendor
          cp packaging/suse/custos-rpmlintrc ~/rpmbuild/SOURCES/
      - name: rpmbuild (with %check)
        run: rpmbuild -ba --define "_topdir $HOME/rpmbuild" packaging/suse/custos.spec
      - name: rpmlint
        run: |
          { cat packaging/suse/custos-rpmlintrc; echo 'addFilter("no-changelogname-tag")'; } >/tmp/rpmlintrc
          rpmlint -r /tmp/rpmlintrc ~/rpmbuild/RPMS/*/custos*.rpm
      - name: Install and smoke-test
        run: |
          rpm -ivh --nodeps ~/rpmbuild/RPMS/*/mcp-gateway-[0-9]*.rpm
          zypper -n --gpg-auto-import-keys in --allow-unsigned-rpm ~/rpmbuild/RPMS/*/custos-*.rpm
          semodule -l | grep -x custos
          getent group agent-clients
          agent-admin check /usr/share/custos/examples/patch-pilot/agent.yaml
          /usr/libexec/custos/agent-launcher version
          test -f /usr/share/mcp-gateway/policy/custos/agents.rego
          test -x /usr/libexec/custos/tests/run-tests.sh
          test -f /usr/share/cockpit/custos/manifest.json
          # The labels the module gives the programs.
          matchpathcon /usr/libexec/custos/agent-launcher | grep -q agent_exec_t
          matchpathcon /usr/libexec/custos/agent-delegate | grep -q mcpsrv_agents_exec_t
      - name: custos-docs served by mcp-docs
        run: |
          test -f /usr/share/custos/docs/user-guide/README.md
          test -f /usr/share/mcp-docs/collections.d/custos.yaml
          GOBIN=/usr/local/bin go install "$MCP_DOCS_MODULE"
          test/docs/mcp-docs-smoke.sh /usr/local/bin/mcp-docs
      - name: Collect the packages for the VM test
        run: cp ~/rpmbuild/RPMS/*/custos*.rpm rpms/ && ls rpms
      - uses: actions/upload-artifact@v4
        with:
          name: rpms-leap16
          path: rpms/
          retention-days: 7

  # The functional tests (custos-tests) in an openSUSE Leap 16 VM
  # with SELinux enforcing, as openQA runs them on a product system.
  vm:
    needs: [opensuse]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
          static: true
      - uses: actions/download-artifact@v4
        with:
          name: rpms-leap16
          path: rpms
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Image cache key
        id: image
        run: echo "week=$(date -u +%G-%V)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vm/base.qcow2
          key: vm-image-leap16-${{ steps.image.outputs.week }}
      - name: Run the functional tests (openSUSE Leap 16.0, SELinux enforcing)
        env:
          WORK: ${{ runner.temp }}/vm
        run: test/vm/run-vm.sh rpms "$(command -v opa)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-logs-leap16
          path: |
            ${{ runner.temp }}/vm/console.log
            ${{ runner.temp }}/vm/prepare.log
            ${{ runner.temp }}/vm/test.log
            ${{ runner.temp }}/vm/results.tap
            ${{ runner.temp }}/vm/results.xml
            ${{ runner.temp }}/vm/avc.txt
            ${{ runner.temp }}/vm/journal.txt
          if-no-files-found: ignore
      - if: always()
        name: Test summary
        run: |
          f="$RUNNER_TEMP/vm/test.log"
          [ -f "$f" ] || exit 0
          {
            echo '### Functional tests (Leap 16.0, SELinux enforcing)'
            tail -1 "$f"
            echo
            grep -E '^(FAIL|SKIP):' "$f" | sed 's/^/- /' || true
          } >>"$GITHUB_STEP_SUMMARY"

  # The OpenShell backend on Leap 16 as its RPM intends it: rootless
  # Podman, SELinux enforcing, the installed packages (open item O10).
  openshell-podman:
    needs: [opensuse]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
          static: true
      - uses: actions/download-artifact@v4
        with:
          name: rpms-leap16
          path: rpms
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Image cache key
        id: image
        run: echo "week=$(date -u +%G-%V)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vm/base.qcow2
          key: vm-image-leap16-${{ steps.image.outputs.week }}
      - name: Run the OpenShell tests (openSUSE Leap 16.0, rootless Podman, SELinux enforcing)
        env:
          WORK: ${{ runner.temp }}/vm
          SUITE: openshell
        run: test/vm/run-vm.sh rpms "$(command -v opa)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openshell-podman-logs-leap16
          path: |
            ${{ runner.temp }}/vm/console.log
            ${{ runner.temp }}/vm/prepare.log
            ${{ runner.temp }}/vm/openshell-setup.log
            ${{ runner.temp }}/vm/test.log
            ${{ runner.temp }}/vm/results.tap
            ${{ runner.temp }}/vm/results.xml
            ${{ runner.temp }}/vm/avc.txt
            ${{ runner.temp }}/vm/journal.txt
          if-no-files-found: ignore
      - if: always()
        name: Test summary
        run: |
          f="$RUNNER_TEMP/vm/test.log"
          [ -f "$f" ] || exit 0
          {
            echo '### OpenShell tests (Leap 16.0, rootless Podman, SELinux enforcing)'
            tail -1 "$f"
            echo
            grep -E '^(FAIL|SKIP):' "$f" | sed 's/^/- /' || true
          } >>"$GITHUB_STEP_SUMMARY"

  # The Cockpit page in a real Cockpit in the Leap 16 VM (SELinux
  # enforcing): logged in as a person, driven by Playwright from here
  # (test/cockpit/vm-test.js), checked in the VM; the screenshots of the
  # real page are uploaded (cockpit-screenshots).
  cockpit-vm:
    needs: [opensuse]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
          static: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright-core@1
      - uses: actions/download-artifact@v4
        with:
          name: rpms-leap16
          path: rpms
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Image cache key
        id: image
        run: echo "week=$(date -u +%G-%V)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vm/base.qcow2
          key: vm-image-leap16-${{ steps.image.outputs.week }}
      - name: Test the page in Cockpit (openSUSE Leap 16.0, SELinux enforcing)
        env:
          WORK: ${{ runner.temp }}/vm
          SUITE: cockpit
          CHROME: /usr/bin/google-chrome
          SHOTS: ${{ runner.temp }}/vm/screenshots
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: test/vm/run-vm.sh rpms "$(command -v opa)"
      # The screenshots also in the log, base64 between markers, for
      # whoever can read the log but not the artifact storage (decode with
      # the lines between "SHOT-BEGIN <name>" and "SHOT-END <name>").
      - if: always()
        name: Screenshots in the log (base64)
        run: |
          for f in "$RUNNER_TEMP"/vm/screenshots/*.png; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .png)
            case $n in failed-*) continue ;; esac
            echo "::group::screenshot $n"
            echo "SHOT-BEGIN $n"
            base64 -w 76 "$f"
            echo "SHOT-END $n"
            echo "::endgroup::"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-screenshots
          path: ${{ runner.temp }}/vm/screenshots/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-vm-logs-leap16
          path: |
            ${{ runner.temp }}/vm/console.log
            ${{ runner.temp }}/vm/prepare.log
            ${{ runner.temp }}/vm/cockpit-setup.log
            ${{ runner.temp }}/vm/test.log
            ${{ runner.temp }}/vm/journal.txt
          if-no-files-found: ignore
      - if: always()
        name: Test summary
        run: |
          f="$RUNNER_TEMP/vm/test.log"
          [ -f "$f" ] || exit 0
          {
            echo '### Cockpit page in a real Cockpit (Leap 16.0, SELinux enforcing)'
            tail -1 "$f"
            echo
            grep -E '^FAIL:' "$f" | sed 's/^/- /' || true
          } >>"$GITHUB_STEP_SUMMARY"

  # The OpenShell backend (CONTRACT.md §3a, §16a) with a real NVIDIA
  # OpenShell on Docker: an agent in a sandbox, its gateway token held by
  # the supervisor, supervised through the relayed socket.
  openshell:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: CGO_ENABLED=0 make build build-tests
      # The agent reaches mcp-gateway's HTTPS listener: the gateway from its
      # repository, in development mode, with OPA (test/openshell/run-spike.sh).
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GATEWAY_REPO }}
          ref: ${{ env.GATEWAY_REF }}
          path: mcp-gateway
      - name: Build mcp-gateway
        run: make -C mcp-gateway build
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
          static: true
      - name: Install OpenShell
        run: |
          curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/main/install.sh | sh
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: OpenShell for root
        # The tests run as root (agent-admin, units); the CLI and its
        # gateway registration are the runner user's.
        run: |
          # The installer puts the CLI in /usr/bin and registers the local
          # gateway (named "openshell") for the runner user.
          openshell --version
          openshell status
          sudo mkdir -p /root/.config
          sudo cp -a "$HOME/.config/openshell" /root/.config/
          sudo openshell gateway list
          sudo openshell status
      - name: Run the OpenShell tests
        run: sudo -E env "PATH=$PATH" MCPGW_SRC="$GITHUB_WORKSPACE/mcp-gateway" OPENSHELL_GATEWAY_USER="$USER" test/openshell/run-spike.sh --disposable --results "$RUNNER_TEMP/osh"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openshell-logs
          path: ${{ runner.temp }}/osh/
          if-no-files-found: ignore
