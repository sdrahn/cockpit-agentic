# What disk-watch may do at the gateway (CONTRACT.md §6). Deleting
# snapshots has no category: an approval every time.
# mcp-gateway-exec-server with the command in exec.d-disk-usage.yaml:
- {server: exec, tool: disk_usage, read_only: true}
- {server: snapper, tool: list_configs, read_only: true}
- {server: snapper, tool: get_config, read_only: true}
- {server: snapper, tool: list_snapshots, read_only: true}
- {server: snapper, tool: delete_snapshots}
- {server: systemd, tool: list_log, read_only: true}
