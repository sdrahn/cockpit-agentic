# A suggested envelope for promoting config-lifecycle (CONTRACT.md §6a):
#   agent-admin promote NAME config-lifecycle --envelope envelopes/config-lifecycle.yaml
# Restarts and reloads without approval on working days during office
# hours, when someone is there to notice; change the time zone. The
# category is demoted at once when a restart fails, an activity reaches
# a limit, or the system is degraded.
windows:
  - {days: [mon, tue, wed, thu, fri], from: '08:00', to: '18:00', tz: Europe/Berlin}
# rate: {calls: 20, per: 1h}       # optional: at most 20 calls per tool per hour, beyond it denied
rollback:
  on: [tool_error, limit_exceeded, health_check_failed]
  health_check: 'systemctl is-system-running --quiet'
