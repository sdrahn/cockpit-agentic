# What patch-pilot may do at the gateway (data.mcp.agents.patch-pilot).
# Read-only only where it says so; everything else changes the system and
# needs an approval in supervised mode (CONTRACT.md §6). The template of
# the same name (/usr/share/custos/templates/patch-pilot) goes further:
# a snapshot first, and task categories (§6a).
- {server: zypp, tool: check_updates, read_only: true}
- {server: zypp, tool: search_packages, read_only: true}
- {server: zypp, tool: plan_install, read_only: true}
- {server: zypp, tool: confirm_install}
- {server: systemd, tool: list_loaded_units, read_only: true}
- {server: systemd, tool: check_restart_reload, read_only: true}
# In bounded mode, this one runs without an approval:
- {server: systemd, tool: change_unit_state, autonomous: true, args: {name: '^nginx\.service$', action: '^restart$'}}
